# Checks the web edition's snapshot of the Agda formalization on GitHub's machines.
#
# The formalization is developed in the private Synthetic-Category-Theory-Agda
# repository. This repository holds a pinned snapshot in agda/ (see
# agda/SNAPSHOT.json), refreshed only with the author's authorization by
# scripts/update_agda_snapshot.py.
#
# - Whenever a push changes the snapshot: the full check, including the slow
#   uncurrying branch (agda/scripts/check_agda.py --full).
# - By hand from the Actions tab: routine, full, or the lossy-unification audit.
#
# Compiled interfaces are cached between runs, so a run only rechecks the
# modules that changed and their dependents. Per-module timings are saved as
# a downloadable artifact of every run. Checks use sequential section groups
# sharing the cache. Import-only aggregates are audited statically, not loaded
# together into one Agda process.
name: Check Agda snapshot

on:
  push:
    branches: [main]
    paths: ['agda/src/**', 'agda/sct.agda-lib', 'agda/SNAPSHOT.json', 'agda/scripts/**', '.github/workflows/agda.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        options: [full, routine, lossy-audit]
        default: full

concurrency:
  group: agda-${{ github.ref }}
  cancel-in-progress: false

env:
  AGDA_VERSION: '2.8.0'
  # GitHub's standard Linux machine has 4 cores and 16 GB of memory.
  GHCRTS: '-M13G -A128M'

jobs:
  check:
    if: github.event_name == 'push' || inputs.mode != 'lossy-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install Agda
        run: |
          curl -sSL -o agda.tar.xz "https://github.com/agda/agda/releases/download/v${AGDA_VERSION}/Agda-v${AGDA_VERSION}-linux.tar.xz"
          mkdir -p "$HOME/agda-bin" && tar xf agda.tar.xz -C "$HOME/agda-bin"
          # Wrapper that also records how long each module takes.
          printf '#!/bin/sh\nexec "%s/agda-bin/agda" --profile=modules "$@"\n' "$HOME" > "$HOME/agda-bin/agda-profiled"
          chmod +x "$HOME/agda-bin/agda-profiled"
          "$HOME/agda-bin/agda" --version

      - name: Restore compiled interfaces
        uses: actions/cache/restore@v4
        with:
          path: agda/_build/${{ env.AGDA_VERSION }}
          key: agda-${{ env.AGDA_VERSION }}-${{ hashFiles('agda/src/**') }}
          restore-keys: agda-${{ env.AGDA_VERSION }}-

      - name: Check
        run: |
          if [ "${{ inputs.mode }}" = "routine" ]; then FLAG=; else FLAG=--full; fi
          python agda/scripts/check_agda.py $FLAG --batch-size 20 --agda "$HOME/agda-bin/agda-profiled"

      - name: Save compiled interfaces (also after a failure or timeout)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: agda/_build/${{ env.AGDA_VERSION }}
          key: agda-${{ env.AGDA_VERSION }}-${{ hashFiles('agda/src/**') }}-${{ github.run_id }}

      - name: Upload log and per-module timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agda-check-${{ github.run_id }}
          path: agda/_build/agda-check/
          retention-days: 90

  lossy-audit:
    if: inputs.mode == 'lossy-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Install Agda
        run: |
          curl -sSL -o agda.tar.xz "https://github.com/agda/agda/releases/download/v${AGDA_VERSION}/Agda-v${AGDA_VERSION}-linux.tar.xz"
          mkdir -p "$HOME/agda-bin" && tar xf agda.tar.xz -C "$HOME/agda-bin"
      - name: Restore compiled interfaces
        uses: actions/cache/restore@v4
        with:
          path: agda/_build/${{ env.AGDA_VERSION }}
          key: agda-${{ env.AGDA_VERSION }}-${{ hashFiles('agda/src/**') }}
          restore-keys: agda-${{ env.AGDA_VERSION }}-
      - name: Check every lossy module without lossy unification
        run: python agda/scripts/audit_lossy.py --agda "$HOME/agda-bin/agda"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lossy-audit-${{ github.run_id }}
          path: agda/_build/lossy-audit/report.*
          retention-days: 90
